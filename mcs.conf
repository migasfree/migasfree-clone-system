# Migasfree Clone System - Configuration

# --- Default system settings (embedded in the image) ---
SERVER_URL="inv.org"
KEYMAP="es"

# Main MCS image size (in MB)
MCS_SIZE_MB="3072"

# --- Testing Script Settings ---
# These variables are used by the ./test script

# Whether to enable UEFI mode in QEMU (true/false)
TEST_UEFI="false"

# Path to OVMF firmware (for UEFI testing)
OVMF_PATH="/usr/share/ovmf/OVMF.fd"

# RAM for the virtual machine
TEST_RAM="2G"

# Name for the temporary testing image
TEST_DISK_NAME="mcs-testing.iso"

# Size for the testing image (the main image will be copied and resized)
TEST_DISK_SIZE="12G"

# Target disk for cloning tests (it will be created if it doesn't exist)
TEST_TARGET_DISK="target-hd.qcow2"
TEST_TARGET_SIZE="30G"
